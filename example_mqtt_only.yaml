# Beispiel: nur MQTT, ohne Home Assistant (z. B. für Kunden mit eigener Datenbank/Visualisierung)
# Es wird nur das JSON im Format "Österreichs Energie (SMA-Adapter)" gesendet.
esphome:
  name: amisreader
  friendly_name: AmisReader

external_components:
  - source: github://hgaderGit/amisreader@main
    components: [amisreader]

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Amisreader Fallback Hotspot"
    password: !secret ap_password

captive_portal:

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_password
  discovery: false

uart:
  id: uart_bus
  tx_pin: GPIO16
  rx_pin: GPIO15
  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 512

# Ohne api: und ohne Sensor-Einträge: nur das JSON auf dem MQTT-Topic
sensor:
  - platform: amisreader
    aes_key: !secret amis_aes_key
    mqtt_json_topic: "AMIS"
